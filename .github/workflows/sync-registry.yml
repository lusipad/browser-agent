name: Sync Model Registry

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动运行
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync model registry from LiteLLM
        run: node scripts/sync-registry.mjs

      - name: Verify unit tests
        run: npm run test:unit

      - name: Commit and push changes to main
        run: |
          if git diff --quiet registry/models.json; then
            echo "No changes detected in registry/models.json."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add registry/models.json
            git commit -m "chore(registry): daily sync model registry from LiteLLM [skip ci]"
            git push origin main
          fi
