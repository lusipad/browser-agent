<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Concept C - Neural Warp Core</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 512px;
      height: 512px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .icon-container {
      width: 512px;
      height: 512px;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Background Cosmic Obsidian -->
        <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#070a12" />
          <stop offset="50%" stop-color="#0b1020" />
          <stop offset="100%" stop-color="#151233" />
        </linearGradient>

        <!-- Ambient Nebula Glow -->
        <radialGradient id="nebulaGlow" cx="256" cy="256" r="230" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
          <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.16" />
          <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
        </radialGradient>

        <!-- Metallic Rim Gradient -->
        <linearGradient id="rimGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
          <stop offset="35%" stop-color="#818cf8" stop-opacity="0.45" />
          <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
        </linearGradient>

        <!-- Primary Ribbon Gradient (Cyan -> Electric Blue -> Violet) -->
        <linearGradient id="ribbon1" x1="120" y1="140" x2="390" y2="370" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#00f5ff" />
          <stop offset="30%" stop-color="#38bdf8" />
          <stop offset="65%" stop-color="#6366f1" />
          <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>

        <!-- Secondary Ribbon Gradient (Hot Magenta -> Purple -> Cyan) -->
        <linearGradient id="ribbon2" x1="140" y1="370" x2="370" y2="140" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#f43f5e" />
          <stop offset="30%" stop-color="#d946ef" />
          <stop offset="70%" stop-color="#6366f1" />
          <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>

        <!-- Specular Highlight for Ribbon 1 -->
        <linearGradient id="ribbonSpec" x1="120" y1="130" x2="390" y2="360" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
          <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.5" />
          <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>

        <!-- Bloom Glow Filter -->
        <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="12" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Deep Shadow Filter -->
        <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
        </filter>

        <!-- Spark Center Glow -->
        <radialGradient id="sparkCenter" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="45%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- 1. Squircle Canvas Background -->
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
      <!-- Ambient Nebula Layer -->
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#nebulaGlow)" />
      <!-- Specular Bevel Border -->
      <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" stroke="url(#rimGrad)" stroke-width="3" />

      <!-- 2. Browser Navigation Elements (Header Pill & Dots) -->
      <g opacity="0.6">
        <!-- Top Browser Tab Pill Notch -->
        <rect x="206" y="32" width="100" height="6" rx="3" fill="#38bdf8" />
        <!-- Window Traffic Dots -->
        <circle cx="48" cy="46" r="4" fill="#f43f5e" opacity="0.8" />
        <circle cx="62" cy="46" r="4" fill="#fbbf24" opacity="0.8" />
        <circle cx="76" cy="46" r="4" fill="#10b981" opacity="0.8" />
      </g>

      <!-- 3. Fine Orbital Horizon Lines -->
      <g opacity="0.25">
        <circle cx="256" cy="256" r="185" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 14" />
        <circle cx="386" cy="126" r="4" fill="#00f5ff" />
        <circle cx="126" cy="386" r="4" fill="#d946ef" />
      </g>

      <!-- 4. Infinite Möbius Loop (The Autonomous Intelligence Stream) -->
      <g filter="url(#ribbonShadow)">
        <!-- Back Loop (Magenta to Cyan) -->
        <path d="M 366 195 
                 C 366 130, 290 120, 256 168 
                 C 222 216, 146 296, 146 361 
                 C 146 426, 222 436, 256 388 
                 C 290 340, 366 260, 366 195 Z" 
              stroke="url(#ribbon2)" 
              stroke-width="38" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              fill="none" />

        <!-- Front Intertwining Loop (Cyan to Violet) -->
        <path d="M 146 195 
                 C 146 130, 222 120, 256 168 
                 C 290 216, 366 296, 366 361 
                 C 366 426, 290 436, 256 388 
                 C 222 340, 146 260, 146 195 Z" 
              stroke="url(#ribbon1)" 
              stroke-width="44" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              fill="none" />

        <!-- Specular Glass Highlight Ridge on Front Loop -->
        <path d="M 146 195 
                 C 146 130, 222 120, 256 168 
                 C 290 216, 366 296, 366 361" 
              stroke="url(#ribbonSpec)" 
              stroke-width="14" 
              stroke-linecap="round" 
              fill="none" />
      </g>

      <!-- 5. Central Intelligence Singularity Spark (✦) -->
      <g transform="translate(256, 278)" filter="url(#bloom)">
        <!-- Outer Halo -->
        <circle cx="0" cy="0" r="28" fill="url(#sparkCenter)" />
        
        <!-- Dazzling 4-Point Star Diamond -->
        <path d="M 0 -36 
                 C 0 -10, 10 0, 36 0 
                 C 10 0, 0 10, 0 36 
                 C 0 10, -10 0, -36 0 
                 C -10 0, 0 -10, 0 -36 Z" 
              fill="#ffffff" />
              
        <!-- Center Hot-White Nucleus -->
        <circle cx="0" cy="0" r="7" fill="#ffffff" />
      </g>
    </svg>
  </div>
</body>
</html>
