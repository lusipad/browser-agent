<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Browser Agent Modern Icon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 512px;
      height: 512px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .icon-container {
      width: 512px;
      height: 512px;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0b0f19" />
          <stop offset="50%" stop-color="#111827" />
          <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>

        <!-- Ambient Nebula Glow -->
        <radialGradient id="ambientGlow" cx="256" cy="240" r="230" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
          <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12" />
          <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
        </radialGradient>

        <!-- Metallic Rim Gradient -->
        <linearGradient id="rimGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
          <stop offset="35%" stop-color="#818cf8" stop-opacity="0.4" />
          <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
        </linearGradient>

        <!-- Helmet Body Gradient -->
        <linearGradient id="helmetGrad" x1="160" y1="120" x2="352" y2="390" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2d3748" />
          <stop offset="30%" stop-color="#1a202c" />
          <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>

        <!-- Visor Neon Glass Gradient -->
        <linearGradient id="visorGrad" x1="140" y1="180" x2="372" y2="340" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#00f2fe" />
          <stop offset="45%" stop-color="#4facfe" />
          <stop offset="80%" stop-color="#7000ff" />
          <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>

        <!-- Visor Bevel / Inner Shadow -->
        <linearGradient id="visorRim" x1="140" y1="170" x2="372" y2="340" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
          <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
        </linearGradient>

        <!-- Eye Core Gradient -->
        <radialGradient id="eyeGlow" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#e0f2fe" />
          <stop offset="100%" stop-color="#38bdf8" />
        </radialGradient>

        <!-- Spark Gradient -->
        <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="50%" stop-color="#67e8f9" />
          <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>

        <!-- Soft Shadow Filter -->
        <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
        </filter>

        <!-- Glow Filter -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Small Glow Filter -->
        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- 1. Squircle Canvas Background -->
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
      <!-- Ambient Glow Layer -->
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ambientGlow)" />
      <!-- Top Specular Highlight Edge -->
      <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" stroke="url(#rimGrad)" stroke-width="3" />

      <!-- 2. Orbital Navigation Ring (Browser Space) -->
      <g opacity="0.45">
        <ellipse cx="256" cy="265" rx="195" ry="180" stroke="url(#visorRim)" stroke-width="2.5" stroke-dasharray="8 6" />
        <circle cx="395" cy="140" r="4.5" fill="#38bdf8" filter="url(#softGlow)" />
        <circle cx="115" cy="385" r="3.5" fill="#818cf8" />
      </g>

      <!-- 3. Robot Copilot Main Silhouette -->
      <g filter="url(#dropShadow)">
        <!-- Helmet Ears / Side Pods -->
        <rect x="94" y="225" width="28" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2.5" />
        <rect x="100" y="243" width="6" height="38" rx="3" fill="#00f2fe" filter="url(#softGlow)" />
        
        <rect x="390" y="225" width="28" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2.5" />
        <rect x="406" y="243" width="6" height="38" rx="3" fill="#a855f7" filter="url(#softGlow)" />

        <!-- Helmet Base Shell -->
        <path d="M 116 260 
                 C 116 160, 180 102, 256 102 
                 C 332 102, 396 160, 396 260 
                 C 396 360, 332 408, 256 408 
                 C 180 408, 116 360, 116 260 Z" 
              fill="url(#helmetGrad)" 
              stroke="rgba(255,255,255,0.16)" 
              stroke-width="2.5" />

        <!-- Helmet Top Crest Accent -->
        <path d="M 226 104 C 236 96, 276 96, 286 104 L 280 126 C 265 122, 247 122, 232 126 Z" 
              fill="#334155" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

        <!-- 4. Luminous Cyber Visor -->
        <g>
          <!-- Visor Ambient Outer Glow (Neon Bloom) -->
          <path d="M 136 256 
                   C 136 182, 184 142, 256 142 
                   C 328 142, 376 182, 376 256 
                   C 376 322, 328 358, 256 358 
                   C 184 358, 136 322, 136 256 Z" 
                fill="#4facfe" opacity="0.3" filter="url(#neonGlow)" />

          <!-- Visor Main Surface -->
          <path d="M 140 256 
                   C 140 186, 186 146, 256 146 
                   C 326 146, 372 186, 372 256 
                   C 372 318, 326 354, 256 354 
                   C 186 354, 140 318, 140 256 Z" 
                fill="url(#visorGrad)" />

          <!-- Visor Inner Metallic Bevel -->
          <path d="M 140 256 
                   C 140 186, 186 146, 256 146 
                   C 326 146, 372 186, 372 256 
                   C 372 318, 326 354, 256 354 
                   C 186 354, 140 318, 140 256 Z" 
                stroke="url(#visorRim)" stroke-width="3" fill="none" />

          <!-- Top Visor Glass Reflection Curve -->
          <path d="M 162 205 C 190 166, 230 156, 276 156 C 314 156, 338 168, 348 180 C 312 174, 240 182, 184 218 C 172 226, 165 218, 162 205 Z" 
                fill="#ffffff" opacity="0.35" />

          <!-- 5. Autonomous Cybernetic Eyes -->
          <!-- Left Eye -->
          <ellipse cx="206" cy="254" rx="23" ry="32" fill="url(#eyeGlow)" filter="url(#softGlow)" />
          <ellipse cx="204" cy="246" rx="9" ry="12" fill="#ffffff" />
          <circle cx="214" cy="260" r="4" fill="#ffffff" opacity="0.9" />

          <!-- Right Eye -->
          <ellipse cx="306" cy="254" rx="23" ry="32" fill="url(#eyeGlow)" filter="url(#softGlow)" />
          <ellipse cx="304" cy="246" rx="9" ry="12" fill="#ffffff" />
          <circle cx="314" cy="260" r="4" fill="#ffffff" opacity="0.9" />

          <!-- Subtle Smile / Sensor Bar below Eyes -->
          <rect x="238" y="316" width="36" height="5" rx="2.5" fill="#ffffff" opacity="0.6" filter="url(#softGlow)" />
        </g>

        <!-- Chin Aerodynamic Vent -->
        <rect x="236" y="378" width="40" height="4" rx="2" fill="#1e293b" />
      </g>

      <!-- 6. Four-Point AI Intelligence Spark (Top Right) -->
      <g transform="translate(372, 76)" filter="url(#neonGlow)">
        <!-- 4-point star path -->
        <path d="M 28 0 C 28 14, 38 24, 56 28 C 38 32, 28 42, 28 56 C 28 42, 18 32, 0 28 C 18 24, 28 14, 28 0 Z" 
              fill="url(#sparkGrad)" />
        <circle cx="28" cy="28" r="4" fill="#ffffff" />
      </g>
    </svg>
  </div>
</body>
</html>
