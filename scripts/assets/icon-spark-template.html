<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Browser Agent - Window Spark Icon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 512px;
      height: 512px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .icon-container {
      width: 512px;
      height: 512px;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Background Gradient -->
        <linearGradient id="bg1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0a0e1a" />
          <stop offset="60%" stop-color="#0f1629" />
          <stop offset="100%" stop-color="#181e36" />
        </linearGradient>

        <!-- Spark Halo Ambient Glow -->
        <radialGradient id="sparkHalo" cx="256" cy="285" r="160" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
          <stop offset="45%" stop-color="#6366f1" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0" />
        </radialGradient>

        <!-- The AI Spark Gradient (Brilliant White to Cyan to Violet) -->
        <linearGradient id="sparkGrad1" x1="160" y1="180" x2="352" y2="380" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="35%" stop-color="#7dd3fc" />
          <stop offset="70%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>

        <!-- Metallic Squircle Rim -->
        <linearGradient id="rim1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
          <stop offset="35%" stop-color="#818cf8" stop-opacity="0.45" />
          <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
        </linearGradient>

        <!-- Window Shadow -->
        <filter id="winShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
        </filter>

        <!-- Neon Bloom Glow -->
        <filter id="glow1" x="-25%" y="-25%" width="150%" height="150%">
          <feGaussianBlur stdDeviation="10" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- 1. Squircle Canvas Base -->
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg1)" />
      <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" stroke="url(#rim1)" stroke-width="2.5" />

      <!-- 2. Browser Window Frame -->
      <g filter="url(#winShadow)">
        <rect x="72" y="96" width="368" height="320" rx="24" fill="#090d16" stroke="rgba(255,255,255,0.16)" stroke-width="2.5" />
        <!-- Window Header Bar -->
        <path d="M 72 148 L 440 148" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
        
        <!-- Traffic Light Dots -->
        <circle cx="106" cy="122" r="6.5" fill="#f43f5e" opacity="0.9" />
        <circle cx="126" cy="122" r="6.5" fill="#fbbf24" opacity="0.9" />
        <circle cx="146" cy="122" r="6.5" fill="#10b981" opacity="0.9" />

        <!-- Active Tab Bar -->
        <rect x="176" y="110" width="120" height="24" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
        <rect x="194" y="119" width="56" height="5.5" rx="2.75" fill="#38bdf8" opacity="0.85" />
      </g>

      <!-- 3. Central Ambient Spark Halo -->
      <circle cx="256" cy="285" r="140" fill="url(#sparkHalo)" />

      <!-- 4. The Central AI Intelligence Spark (Bursting from viewport) -->
      <g filter="url(#glow1)">
        <path d="M 256 195 
                 C 256 250, 275 285, 346 285 
                 C 275 285, 256 320, 256 375 
                 C 256 320, 237 285, 166 285 
                 C 237 285, 256 250, 256 195 Z" 
              fill="url(#sparkGrad1)" />
        <!-- Hot-white Core -->
        <circle cx="256" cy="285" r="10" fill="#ffffff" />
      </g>

      <!-- 5. Subtle Diagonal Optical Rays (✦) -->
      <g opacity="0.85">
        <line x1="190" y1="219" x2="322" y2="351" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round" />
        <line x1="322" y1="219" x2="190" y2="351" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="214" cy="243" r="3" fill="#ffffff" />
        <circle cx="298" cy="327" r="3" fill="#ffffff" />
      </g>
    </svg>
  </div>
</body>
</html>
